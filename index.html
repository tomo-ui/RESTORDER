<style>
/* krytyczny CSS splasha – inline, żeby pierwszy rysunek (zimny start, wolna sieć) nie błysnął niestylowanym SVG ani białym tłem */
html, body { margin: 0; background: #d9531e; }
#splash { position: fixed; left: 0; top: 0; right: 0; height: 100vh; height: 100lvh; z-index: 200; background: #d9531e; color: #fff;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 34px;
  font: 800 26px/1.2 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; letter-spacing: .14em; transition: opacity .35s; }
#splash.hide { opacity: 0; pointer-events: none; }
.sp-logo { width: 132px; height: 132px; border-radius: 29px; overflow: hidden; background: #d9531e; box-shadow: 0 14px 32px rgba(0,0,0,.28); }
.sp-logo svg { width: 100%; height: 100%; display: block; filter: none; }
.sp-board { animation: none; }
.sp-chk { fill: none; stroke: #d9531e; stroke-width: 18; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 80; stroke-dashoffset: 80; animation: spDraw .45s ease-out forwards; }
.sp-ln { fill: #cdb9aa; transform-box: fill-box; transform-origin: left center; transform: scaleX(.1); animation: spGrow .5s ease-out forwards; }
.s1 { animation-delay: 0s; } .s2 { animation-delay: .3s; } .s3 { animation-delay: .6s; }
#splash .wordmark { opacity: 0; padding-left: .14em; animation: spFade .45s .35s ease-out forwards; }
@keyframes spDraw { to { stroke-dashoffset: 0; } }
@keyframes spGrow { to { transform: scaleX(1); } }
@keyframes spFade { to { opacity: 1; } }
</style>
<link rel="stylesheet" href="style.css" media="print" onload="this.media='all'">

<script>
/* pomiar viewportu przy starcie (do diagnostyki w Ustawieniach) */
(function () {
  var t0 = Date.now(), log = [], probes = {};
  function mk(name, css) {
    var d = document.createElement('div');
    d.style.cssText = 'position:fixed;left:0;width:1px;visibility:hidden;pointer-events:none;' + css;
    document.documentElement.appendChild(d); probes[name] = d;
  }
  try {
    mk('fixed', 'top:0;bottom:0');
    mk('dvh', 'top:0;height:100dvh');
    mk('lvh', 'top:0;height:100lvh');
    mk('svh', 'top:0;height:100svh');
    mk('safe', 'top:0;height:1px;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)');
  } catch (e) {}
  function snap() {
    try {
      var cs = getComputedStyle(probes.safe), vv = window.visualViewport;
      log.push({
        t: Date.now() - t0, ih: innerHeight, sh: screen.height,
        fx: Math.round(probes.fixed.getBoundingClientRect().height), dvh: Math.round(probes.dvh.getBoundingClientRect().height),
        lvh: Math.round(probes.lvh.getBoundingClientRect().height), svh: Math.round(probes.svh.getBoundingClientRect().height),
        st: cs.paddingTop, sb: cs.paddingBottom, vv: vv ? Math.round(vv.height) : null
      });
      localStorage.setItem('restorder.boot', JSON.stringify(log));
    } catch (e) {}
  }
  snap();
  [250, 800, 1500, 2500, 3500].forEach(function (ms) { setTimeout(snap, ms); });
  window.addEventListener('resize', snap);
})();
</script>

    </g>

</div>
